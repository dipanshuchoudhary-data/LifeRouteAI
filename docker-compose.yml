services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ASSISTANT_CONNECTOR_URL: ${ASSISTANT_CONNECTOR_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
